apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: gcr.io/todo-app-proje/todo-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_PATH
          value: "/data/todo.db"
        volumeMounts:
        - name: todo-data
          mountPath: /data
      volumes:
      - name: todo-data
        persistentVolumeClaim:
          claimName: todo-pvc
