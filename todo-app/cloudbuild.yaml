steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/todo-app:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/todo-app:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'container'
    - 'clusters'
    - 'get-credentials'
    - 'todo-cluster'
    - '--zone'
    - 'europe-west1-b'
    - '--project'
    - '$PROJECT_ID'

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['set', 'image', 'deployment/todo-app', 'todo-app=gcr.io/$PROJECT_ID/todo-app:$COMMIT_SHA', '-n', 'todo-app']
    env:
    - 'CLOUDSDK_COMPUTE_ZONE=europe-west1-b'
    - 'CLOUDSDK_CONTAINER_CLUSTER=todo-cluster'

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'status', 'deployment/todo-app', '-n', 'todo-app']
    env:
    - 'CLOUDSDK_COMPUTE_ZONE=europe-west1-b'
    - 'CLOUDSDK_CONTAINER_CLUSTER=todo-cluster'

images:
  - 'gcr.io/$PROJECT_ID/todo-app:$COMMIT_SHA'
